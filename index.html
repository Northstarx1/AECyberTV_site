  <style>
    :root{
      --primary:#B2248E; --accent:#FE8927;
      --bg:#0b0b0c; --card:#14161b;
      --border:rgba(255,255,255,.12);
      --text:#f6f7f9; --muted:rgba(255,255,255,.75);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:radial-gradient(1000px 600px at 20% 10%, rgba(178,36,142,.25), transparent 60%),
                 radial-gradient(900px 500px at 80% 30%, rgba(254,137,39,.18), transparent 55%),
                 var(--bg);
      color:var(--text); min-height:100vh; display:flex; align-items:center;
    }
    .wrap{width:min(980px,92vw); margin:0 auto; padding:24px}
    .card{
      background:rgba(20,22,27,.9);
      border:1px solid var(--border);
      border-radius:18px;
      padding:26px;
      box-shadow:0 18px 60px rgba(0,0,0,.55);
    }
    .top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
    .brand{
      font-weight:900; letter-spacing:.4px; font-size:28px;
      background:linear-gradient(90deg,var(--accent),var(--primary));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .lang{display:flex; gap:8px}
    .lang button{
      background:#16171a; border:1px solid rgba(255,255,255,.10);
      color:#EDEEF0; padding:8px 12px; border-radius:10px; cursor:pointer;
    }
    .lang button.active{background:var(--primary); color:#0b0b0c; border-color:var(--primary); font-weight:800}
    h1{margin:18px 0 8px; font-size:clamp(26px,4vw,42px)}
    p{margin:0 0 14px; color:var(--muted); line-height:1.7}
    .btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
    .btn{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:#121316; color:#EDEEF0; text-decoration:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--accent),var(--primary));
      color:#0b0b0c; border-color:transparent; font-weight:900;
    }
    small{display:block; margin-top:14px; color:rgba(255,255,255,.55)}
    /* Floating chat icons (optional) */
    .floating-chat{ position:fixed; bottom:22px; left:22px; z-index:9999; display:flex; flex-direction:column; gap:12px; }
    .floating-chat a{ display:block; line-height:0; }
    .floating-chat img{ width:44px; height:44px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.55)); transition: transform .2s ease; }
    .floating-chat img:hover{ transform: scale(1.07); }
    @media (max-width:480px){ .floating-chat img{ width:40px; height:40px; } }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <div class="top">
        <div class="brand">AECyberTV</div>
        <div class="lang">
          <button id="lang_en" class="active" type="button">EN</button>
          <button id="lang_ar" type="button">العربية</button>
        </div>
      </div>

      <h1 data-en="We’re improving the website 🛠️" data-ar="الموقع تحت التطوير 🛠️">We’re improving the website 🛠️</h1>
      <p data-en="AECyberTV website is temporarily paused for updates and improvements. We’ll be back soon."
         data-ar="موقع AECyberTV متوقف مؤقتًا للتحديثات والتحسينات. بنرجع قريب إن شاء الله.">
         AECyberTV website is temporarily paused for updates and improvements. We’ll be back soon.
      </p>

      <p data-en="For subscriptions and support, contact us here:"
         data-ar="للاشتراكات والدعم، تواصل معنا هنا:">
         For subscriptions and support, contact us here:
      </p>

      <div class="btns">
        <a class="btn primary" href="https://t.me/AECYBERTVBOT" target="_blank" rel="noopener"
           data-en="🤖 Telegram Bot" data-ar="🤖 بوت تيليجرام">🤖 Telegram Bot</a>

        <a class="btn" href="https://wa.me/message/PT2D2S5UFVOTC1" target="_blank" rel="noopener"
           data-en="💚 WhatsApp" data-ar="💚 واتساب">💚 WhatsApp</a>
      </div>

      <small data-en="© AECyberTV • All rights reserved."
             data-ar="© AECyberTV • جميع الحقوق محفوظة.">© AECyberTV • All rights reserved.</small>
    </section>
  </main>

  <!-- Optional floating icons -->
  <div class="floating-chat" role="navigation" aria-label="Quick chat links">
    <a href="https://wa.me/message/PT2D2S5UFVOTC1" target="_blank" rel="noopener" aria-label="WhatsApp">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
    </a>
    <a href="https://t.me/AECYBERTVBOT" target="_blank" rel="noopener" aria-label="Telegram">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
    </a>
  </div>

  <script>
    function setLang(lang){
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      document.querySelectorAll('[data-en]').forEach(el=>{
        const en = el.getAttribute('data-en'); const ar = el.getAttribute('data-ar');
        el.textContent = (lang === 'ar') ? (ar || en) : (en || ar || el.textContent);
      });
      document.getElementById('lang_en').classList.toggle('active', lang==='en');
      document.getElementById('lang_ar').classList.toggle('active', lang==='ar');
      localStorage.setItem('aec_lang_maint', lang);
    }
    document.getElementById('lang_en').addEventListener('click', ()=>setLang('en'));
    document.getElementById('lang_ar').addEventListener('click', ()=>setLang('ar'));
    setLang(localStorage.getItem('aec_lang_maint') || 'en');
  </script>
</body>
